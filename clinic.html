<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Clinic Profile - Health Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafaf8}.navbar{background:white;border-bottom:1px solid #e8e6e1;padding:1rem 2rem}.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:600;color:#2c5f2d;text-decoration:none}.btn-primary{background:#2c5f2d;color:white;border:none;padding:.5rem 1rem;border-radius:8px;cursor:pointer}.clinic-container{max-width:1200px;margin:0 auto;padding:2rem}.clinic-header{background:white;border-radius:20px;padding:2rem;margin-bottom:2rem}.score-badge{background:#e8f0e8;padding:.25rem .75rem;border-radius:20px;display:inline-block}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Health Platform</a></div></nav><main><div class="clinic-container" id="clinicContainer">Loading...</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{firebaseConfig}from'./js/firebase-config.js';const app=initializeApp(firebaseConfig);const db=getFirestore(app);const urlParams=new URLSearchParams(window.location.search);const clinicId=urlParams.get('id');if(clinicId){const docRef=doc(db,'clinics',clinicId);const docSnap=await getDoc(docRef);if(docSnap.exists()){const c=docSnap.data();document.getElementById('clinicContainer').innerHTML=`<div class="clinic-header"><h1>${c.clinicName||c.name}</h1><p>📍 ${c.city||'Unknown'}</p><div class="score-badge">RCS: ${c.rcs||0}</div><button class="btn-primary" style="margin-top:1rem" onclick="alert('Contact coming soon')">Contact Clinic</button></div>`}else{document.getElementById('clinicContainer').innerHTML='<p>Clinic not found.</p>'}}</script></body></html>
