<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Doctor Profile - Health Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafaf8}.navbar{background:white;border-bottom:1px solid #e8e6e1;padding:1rem 2rem}.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:600;color:#2c5f2d;text-decoration:none}.btn-outline{border:1px solid #2c5f2d;padding:.5rem 1rem;border-radius:8px;background:transparent;cursor:pointer}.btn-primary{background:#2c5f2d;color:white;border:none;padding:.5rem 1rem;border-radius:8px;cursor:pointer}.profile-container{max-width:1200px;margin:0 auto;padding:2rem}.profile-header{background:white;border-radius:20px;padding:2rem;margin-bottom:2rem;display:flex;flex-wrap:wrap;gap:2rem;align-items:center}.profile-avatar{width:100px;height:100px;background:#2c5f2d;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:2rem}.score-badge{background:#e8f0e8;padding:.25rem .75rem;border-radius:20px;display:inline-block}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-top:1rem;margin-bottom:2rem}.stat-card{background:white;border-radius:16px;padding:1rem;text-align:center}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Health Platform</a><div><button class="btn-outline" onclick="window.location.href='login.html'">Sign In</button></div></div></nav><main><div class="profile-container" id="profileContainer">Loading...</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{firebaseConfig}from'./js/firebase-config.js';const app=initializeApp(firebaseConfig);const db=getFirestore(app);const urlParams=new URLSearchParams(window.location.search);const doctorId=urlParams.get('id');if(doctorId){const docRef=doc(db,'doctors',doctorId);const docSnap=await getDoc(docRef);if(docSnap.exists()){const d=docSnap.data();document.getElementById('profileContainer').innerHTML=`<div class="profile-header"><div class="profile-avatar">${d.name?.charAt(0)||'D'}</div><div><h1>${d.name}</h1><p>${d.specialty||'Doctor'}</p><p>📍 ${d.city||'Unknown'}</p><div class="score-badge">KCS: ${d.kcs||0}</div><button class="btn-primary" style="margin-top:1rem" onclick="alert('Booking coming soon')">Request Appointment</button></div></div><div class="stats-grid"><div class="stat-card"><div class="score-badge" style="font-size:1.5rem">${d.articles?.length||0}</div><div>Articles</div></div><div class="stat-card"><div class="score-badge" style="font-size:1.5rem">${d.answers||0}</div><div>Answers</div></div></div><div class="stats-grid"><h3>Bio</h3><p>${d.bio||'No bio provided yet.'}</p></div>`}else{document.getElementById('profileContainer').innerHTML='<p>Doctor not found.</p>'}}</script></body></html>
