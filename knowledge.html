<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Knowledge - Health Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafaf8}.navbar{background:white;border-bottom:1px solid #e8e6e1;padding:1rem 2rem}.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:600;color:#2c5f2d;text-decoration:none}.btn-outline{border:1px solid #2c5f2d;padding:.5rem 1rem;border-radius:8px;background:transparent;cursor:pointer}.knowledge-container{max-width:1200px;margin:0 auto;padding:2rem}.article-card{background:white;border-radius:16px;padding:1.5rem;margin-bottom:1rem}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Health Platform</a><div><button class="btn-outline" onclick="window.location.href='login.html'">Sign In</button></div></div></nav><main><div class="knowledge-container"><h1>Medical Knowledge</h1><div id="articlesContainer"></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,query,orderBy,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{firebaseConfig}from'./js/firebase-config.js';const app=initializeApp(firebaseConfig);const db=getFirestore(app);async function loadArticles(){const q=query(collection(db,'articles'),orderBy('timestamp','desc'));const snapshot=await getDocs(q);const articles=snapshot.docs.map(doc=>doc.data());const container=document.getElementById('articlesContainer');if(articles.length===0){container.innerHTML='<p>No articles yet.</p>';return}container.innerHTML=articles.map(a=>`<div class="article-card"><h3>${a.title}</h3><p>By ${a.doctorName} · ${a.specialty}</p><p>${a.content.substring(0,200)}...</p><button class="btn-outline" onclick="alert('Full article coming soon')">Read More</button></div>`).join('')}loadArticles();</script></body></html>
