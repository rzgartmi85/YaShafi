<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leaderboard - Health Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafaf8}.navbar{background:white;border-bottom:1px solid #e8e6e1;padding:1rem 2rem}.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:600;color:#2c5f2d;text-decoration:none}.leaderboard-container{max-width:1200px;margin:0 auto;padding:2rem}.tabs{display:flex;gap:1rem;margin-bottom:2rem;border-bottom:2px solid #e8e6e1}.tab{padding:1rem 2rem;cursor:pointer;color:#6a6a67;border-bottom:2px solid transparent;margin-bottom:-2px}.tab.active{color:#2c5f2d;border-bottom-color:#2c5f2d}table{width:100%;background:white;border-radius:16px;overflow:hidden}th,td{padding:1rem;text-align:left;border-bottom:1px solid #e8e6e1}th{background:#2c5f2d;color:white}.rank-1{color:#d4a017;font-weight:bold}.rank-2{color:#a0a0a0;font-weight:bold}.rank-3{color:#cd7f32;font-weight:bold}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Health Platform</a></div></nav><main><div class="leaderboard-container"><h1>🏆 Leaderboard</h1><div class="tabs"><div class="tab active" data-tab="doctors">Doctors (KCS)</div><div class="tab" data-tab="clinics">Clinics (RCS)</div></div><div id="doctorsPanel"><table><thead><tr><th>Rank</th><th>Doctor</th><th>Specialty</th><th>City</th><th>KCS Score</th></tr></thead><tbody id="doctorsList"></tbody></table></div><div id="clinicsPanel" style="display:none;"><table><thead><tr><th>Rank</th><th>Clinic</th><th>City</th><th>RCS Score</th></tr></thead><tbody id="clinicsList"></tbody></table></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,getDocs,query,orderBy}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{firebaseConfig}from'./js/firebase-config.js';const app=initializeApp(firebaseConfig);const db=getFirestore(app);async function loadDoctors(){const q=query(collection(db,'doctors'),orderBy('kcs','desc'));const snapshot=await getDocs(q);const tbody=document.getElementById('doctorsList');if(snapshot.empty){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;">No doctors yet.</td></tr>';return}tbody.innerHTML=snapshot.docs.map((doc,idx)=>{const d=doc.data();const rankClass=idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'';return`<tr><td class="${rankClass}">#${idx+1}</td><td>${d.name}</td><td>${d.specialty||'-'}</td><td>${d.city||'-'}</td><td><strong>${d.kcs||0}</strong></td></tr>`}).join('')}async function loadClinics(){const q=query(collection(db,'clinics'),orderBy('rcs','desc'));const snapshot=await getDocs(q);const tbody=document.getElementById('clinicsList');if(snapshot.empty){tbody.innerHTML='<tr><td colspan="4" style="text-align:center;">No clinics yet.</td></tr>';return}tbody.innerHTML=snapshot.docs.map((doc,idx)=>{const c=doc.data();const rankClass=idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'';return`<tr><td class="${rankClass}">#${idx+1}</td><td>${c.clinicName||c.name}</td><td>${c.city||'-'}</td><td><strong>${c.rcs||0}</strong></td></tr>`}).join('')}document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');const isDoctors=tab.dataset.tab==='doctors';document.getElementById('doctorsPanel').style.display=isDoctors?'block':'none';document.getElementById('clinicsPanel').style.display=isDoctors?'none':'block';if(isDoctors)loadDoctors();else loadClinics()})});loadDoctors();loadClinics();</script></body></html>
