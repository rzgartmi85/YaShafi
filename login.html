<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Health Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #e8f0e8, #f5f8f2); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: white; border-radius: 24px; padding: 2rem; max-width: 450px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo a { font-size: 1.75rem; font-weight: 600; color: #2c5f2d; text-decoration: none; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid #e8e6e1; }
        .tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #6a6a67; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #2c5f2d; border-bottom-color: #2c5f2d; }
        .form-group { margin-bottom: 1rem; }
        input, select { width: 100%; padding: 0.875rem; border: 1px solid #e0ddd5; border-radius: 12px; font-size: 1rem; }
        .btn-primary { width: 100%; background: #2c5f2d; color: white; border: none; padding: 0.875rem; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-primary:hover { background: #1e3a1f; }
        .btn-google { width: 100%; background: white; color: #444; border: 1px solid #ddd; padding: 0.875rem; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-google:hover { background: #f5f5f5; }
        .divider { text-align: center; margin: 1rem 0; color: #aaa; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #ddd; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .message { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; text-align: center; display: none; }
        .message.error { background: #fee; color: #c00; display: block; }
        .message.success { background: #e8f0e8; color: #2c5f2d; display: block; }
        .role-selector { margin: 1rem 0; }
        .role-selector label { margin-right: 1rem; font-weight: normal; }
        .hidden { display: none; }
        .forgot-link { text-align: center; margin-top: 1rem; }
        .forgot-link a { color: #2c5f2d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><a href="index.html">Health Platform</a></div>
        <div class="tabs">
            <div class="tab active" data-tab="login">Sign In</div>
            <div class="tab" data-tab="register">Create Account</div>
        </div>
        
        <div id="loginForm">
            <form id="loginFormElement">
                <div class="form-group"><input type="email" id="loginEmail" placeholder="Email" required></div>
                <div class="form-group"><input type="password" id="loginPassword" placeholder="Password" required></div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            
            <div class="divider">OR</div>
            
            <button id="googleSignInBtn" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            
            <div class="forgot-link"><a href="#" id="forgotPasswordLink">Forgot password?</a></div>
        </div>
        
        <div id="registerForm" style="display: none;">
            <form id="registerFormElement">
                <div class="role-selector">
                    <label><input type="radio" name="role" value="patient" checked> Patient</label>
                    <label><input type="radio" name="role" value="doctor"> Doctor</label>
                    <label><input type="radio" name="role" value="clinic"> Clinic</label>
                </div>
                <div class="form-group"><input type="text" id="registerName" placeholder="Full Name" required></div>
                <div class="form-group"><input type="email" id="registerEmail" placeholder="Email" required></div>
                <div class="form-group"><input type="password" id="registerPassword" placeholder="Password" required></div>
                <div id="doctorFields" class="hidden">
                    <div class="form-group"><input type="text" id="doctorSpecialty" placeholder="Specialty"></div>
                    <div class="form-group"><input type="text" id="doctorLicense" placeholder="License Number"></div>
                </div>
                <div id="clinicFields" class="hidden">
                    <div class="form-group"><input type="text" id="clinicName" placeholder="Clinic/Hospital Name"></div>
                    <div class="form-group"><input type="text" id="clinicCity" placeholder="City"></div>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            
            <div class="divider">OR</div>
            
            <button id="googleSignUpBtn" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign up with Google
            </button>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { firebaseConfig } from './js/firebase-config.js';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const isLogin = tab.dataset.tab === 'login';
                document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
                document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
                document.getElementById('message').className = 'message';
            });
        });
        
        // Role field visibility
        document.querySelectorAll('input[name="role"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const role = e.target.value;
                document.getElementById('doctorFields').classList.add('hidden');
                document.getElementById('clinicFields').classList.add('hidden');
                if (role === 'doctor') document.getElementById('doctorFields').classList.remove('hidden');
                if (role === 'clinic') document.getElementById('clinicFields').classList.remove('hidden');
            });
        });
        
        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
            setTimeout(() => el.className = 'message', 5000);
        }
        
        async function handleGoogleSignIn(isRegister = false) {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (!userDoc.exists() && isRegister) {
                    const role = prompt('Are you a Patient, Doctor, or Clinic?', 'Patient');
                    let validRole = 'patient';
                    if (role && role.toLowerCase() === 'doctor') validRole = 'doctor';
                    if (role && role.toLowerCase() === 'clinic') validRole = 'clinic';
                    
                    const profileData = {
                        id: user.uid,
                        email: user.email,
                        name: user.displayName || user.email.split('@')[0],
                        role: validRole,
                        createdAt: new Date().toISOString()
                    };
                    
                    if (validRole === 'doctor') {
                        profileData.kcs = 0;
                        profileData.articles = [];
                        profileData.answers = 0;
                        await setDoc(doc(db, 'doctors', user.uid), profileData);
                    } else if (validRole === 'clinic') {
                        profileData.rcs = 0;
                        await setDoc(doc(db, 'clinics', user.uid), profileData);
                    } else {
                        profileData.points = 0;
                        profileData.bookmarks = [];
                    }
                    
                    await setDoc(doc(db, 'users', user.uid), profileData);
                    showMessage('Account created with Google! Redirecting...', 'success');
                } else if (!userDoc.exists() && !isRegister) {
                    const profileData = {
                        id: user.uid,
                        email: user.email,
                        name: user.displayName || user.email.split('@')[0],
                        role: 'patient',
                        points: 0,
                        bookmarks: [],
                        createdAt: new Date().toISOString()
                    };
                    await setDoc(doc(db, 'users', user.uid), profileData);
                }
                
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        // Email/Password Login
        document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                showMessage(error.message, 'error');
            }
        });
        
        // Email/Password Registration
        document.getElementById('registerFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.querySelector('input[name="role"]:checked').value;
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                const profileData = {
                    id: user.uid,
                    email,
                    name,
                    role,
                    createdAt: new Date().toISOString()
                };
                
                if (role === 'doctor') {
                    profileData.specialty = document.getElementById('doctorSpecialty').value;
                    profileData.license = document.getElementById('doctorLicense').value;
                    profileData.kcs = 0;
                    profileData.articles = [];
                    profileData.answers = 0;
                    await setDoc(doc(db, 'doctors', user.uid), profileData);
                } else if (role === 'clinic') {
                    profileData.clinicName = document.getElementById('clinicName').value;
                    profileData.city = document.getElementById('clinicCity').value;
                    profileData.rcs = 0;
                    await setDoc(doc(db, 'clinics', user.uid), profileData);
                } else {
                    profileData.points = 0;
                    profileData.bookmarks = [];
                }
                
                await setDoc(doc(db, 'users', user.uid), profileData);
                showMessage('Account created! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 2000);
            } catch (error) {
                showMessage(error.message, 'error');
            }
        });
        
        // Google Sign In/Up buttons
        document.getElementById('googleSignInBtn').addEventListener('click', () => handleGoogleSignIn(false));
        document.getElementById('googleSignUpBtn').addEventListener('click', () => handleGoogleSignIn(true));
        
        // Password reset
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('Enter your email address:');
            if (email) {
                try {
                    await sendPasswordResetEmail(auth, email);
                    alert('Password reset email sent! Check your inbox.');
                } catch (error) {
                    alert(error.message);
                }
            }
        });
    </script>
</body>
</html>
