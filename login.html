<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In - Health Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#e8f0e8,#f5f8f2);min-height:100vh;display:flex;justify-content:center;align-items:center}.card{background:white;border-radius:24px;padding:2rem;max-width:450px;width:90%;box-shadow:0 20px 40px rgba(0,0,0,0.1)}.logo{text-align:center;margin-bottom:2rem}.logo a{font-size:1.75rem;font-weight:600;color:#2c5f2d;text-decoration:none}.tabs{display:flex;gap:1rem;margin-bottom:2rem;border-bottom:2px solid #e8e6e1}.tab{flex:1;text-align:center;padding:0.75rem;cursor:pointer;color:#6a6a67;border-bottom:2px solid transparent;margin-bottom:-2px}.tab.active{color:#2c5f2d;border-bottom-color:#2c5f2d}.form-group{margin-bottom:1rem}input,select{width:100%;padding:0.875rem;border:1px solid #e0ddd5;border-radius:12px;font-size:1rem}.btn-primary{width:100%;background:#2c5f2d;color:white;border:none;padding:0.875rem;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:1rem}.btn-primary:hover{background:#1e3a1f}.message{margin-top:1rem;padding:0.75rem;border-radius:8px;text-align:center;display:none}.message.error{background:#fee;color:#c00;display:block}.message.success{background:#e8f0e8;color:#2c5f2d;display:block}.role-selector{margin:1rem 0}.role-selector label{margin-right:1rem;font-weight:normal}.hidden{display:none}</style></head>
<body><div class="card"><div class="logo"><a href="index.html">Health Platform</a></div><div class="tabs"><div class="tab active" data-tab="login">Sign In</div><div class="tab" data-tab="register">Create Account</div></div><div id="loginForm"><form id="loginFormElement"><div class="form-group"><input type="email" id="loginEmail" placeholder="Email" required></div><div class="form-group"><input type="password" id="loginPassword" placeholder="Password" required></div><button type="submit" class="btn-primary">Sign In</button><p style="text-align:center;margin-top:1rem;"><a href="#" onclick="resetPassword()" style="color:#2c5f2d;">Forgot password?</a></p></form></div><div id="registerForm" style="display:none;"><form id="registerFormElement"><div class="role-selector"><label><input type="radio" name="role" value="patient" checked> Patient</label><label><input type="radio" name="role" value="doctor"> Doctor</label><label><input type="radio" name="role" value="clinic"> Clinic</label></div><div class="form-group"><input type="text" id="registerName" placeholder="Full Name" required></div><div class="form-group"><input type="email" id="registerEmail" placeholder="Email" required></div><div class="form-group"><input type="password" id="registerPassword" placeholder="Password" required></div><div id="doctorFields" class="hidden"><div class="form-group"><input type="text" id="doctorSpecialty" placeholder="Specialty"></div><div class="form-group"><input type="text" id="doctorLicense" placeholder="License Number"></div></div><div id="clinicFields" class="hidden"><div class="form-group"><input type="text" id="clinicName" placeholder="Clinic/Hospital Name"></div><div class="form-group"><input type="text" id="clinicCity" placeholder="City"></div></div><button type="submit" class="btn-primary">Create Account</button></form></div><div id="message" class="message"></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{getFirestore,doc,setDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{firebaseConfig}from'./js/firebase-config.js';const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');const isLogin=tab.dataset.tab==='login';document.getElementById('loginForm').style.display=isLogin?'block':'none';document.getElementById('registerForm').style.display=isLogin?'none':'block'})});document.querySelectorAll('input[name="role"]').forEach(radio=>{radio.addEventListener('change',(e)=>{const role=e.target.value;document.getElementById('doctorFields').classList.add('hidden');document.getElementById('clinicFields').classList.add('hidden');if(role==='doctor')document.getElementById('doctorFields').classList.remove('hidden');if(role==='clinic')document.getElementById('clinicFields').classList.remove('hidden')})});function showMessage(msg,type){const el=document.getElementById('message');el.textContent=msg;el.className=`message ${type}`;setTimeout(()=>el.className='message',3000)}document.getElementById('loginFormElement').addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('loginEmail').value;const password=document.getElementById('loginPassword').value;try{await signInWithEmailAndPassword(auth,email,password);window.location.href='dashboard.html'}catch(error){showMessage(error.message,'error')}});document.getElementById('registerFormElement').addEventListener('submit',async(e)=>{e.preventDefault();const role=document.querySelector('input[name="role"]:checked').value;const name=document.getElementById('registerName').value;const email=document.getElementById('registerEmail').value;const password=document.getElementById('registerPassword').value;try{const userCredential=await createUserWithEmailAndPassword(auth,email,password);const user=userCredential.user;const profileData={id:user.uid,email,name,role,createdAt:new Date().toISOString()};if(role==='doctor'){profileData.specialty=document.getElementById('doctorSpecialty').value;profileData.license=document.getElementById('doctorLicense').value;profileData.kcs=0;profileData.articles=[];profileData.answers=0;await setDoc(doc(db,'doctors',user.uid),profileData)}if(role==='clinic'){profileData.clinicName=document.getElementById('clinicName').value;profileData.city=document.getElementById('clinicCity').value;profileData.rcs=0;await setDoc(doc(db,'clinics',user.uid),profileData)}if(role==='patient'){profileData.points=0;profileData.bookmarks=[]}await setDoc(doc(db,'users',user.uid),profileData);showMessage('Account created! Redirecting...','success');setTimeout(()=>window.location.href='dashboard.html',2000)}catch(error){showMessage(error.message,'error')}});window.resetPassword=async()=>{const email=prompt('Enter your email address:');if(email){try{await sendPasswordResetEmail(auth,email);alert('Password reset email sent!')}catch(error){alert(error.message)}}};</script></body></html>
