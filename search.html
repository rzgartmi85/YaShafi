<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Find a Doctor - Health Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafaf8}.navbar{background:white;border-bottom:1px solid #e8e6e1;padding:1rem 2rem}.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:600;color:#2c5f2d;text-decoration:none}.btn-outline{border:1px solid #2c5f2d;padding:.5rem 1rem;border-radius:8px;background:transparent;cursor:pointer}.search-container{max-width:1200px;margin:0 auto;padding:2rem}.doctor-card{background:white;border-radius:16px;padding:1.5rem;margin-bottom:1rem;display:flex;gap:1.5rem;align-items:center}.doctor-avatar{width:80px;height:80px;background:#2c5f2d;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:1.75rem}.score-badge{background:#e8f0e8;padding:.25rem .75rem;border-radius:20px;display:inline-block}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Health Platform</a><div><button class="btn-outline" onclick="window.location.href='login.html'">Sign In</button></div></div></nav><main><div class="search-container"><h1>Find a Doctor</h1><input type="text" id="searchInput" placeholder="Search by name, specialty, or city..." style="width:100%;padding:1rem;margin:1rem 0;border:1px solid #ddd;border-radius:8px"><div id="results"></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{firebaseConfig}from'./js/firebase-config.js';const app=initializeApp(firebaseConfig);const db=getFirestore(app);let doctors=[];async function loadDoctors(){const snapshot=await getDocs(collection(db,'doctors'));doctors=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));renderDoctors()}function renderDoctors(){const searchTerm=document.getElementById('searchInput').value.toLowerCase();const filtered=doctors.filter(d=>d.name?.toLowerCase().includes(searchTerm)||d.specialty?.toLowerCase().includes(searchTerm)||d.city?.toLowerCase().includes(searchTerm));const container=document.getElementById('results');if(filtered.length===0){container.innerHTML='<p>No doctors found.</p>';return}container.innerHTML=filtered.map(d=>`<div class="doctor-card"><div class="doctor-avatar">${d.name?.charAt(0)||'D'}</div><div><h3>${d.name}</h3><p>${d.specialty||'Doctor'}</p><p>📍 ${d.city||'Unknown'}</p><div class="score-badge">KCS: ${d.kcs||0}</div><button class="btn-outline" style="margin-top:1rem" onclick="window.location.href='doctor-profile.html?id=${d.id}'">View Profile</button></div></div>`).join('')}document.getElementById('searchInput').addEventListener('input',renderDoctors);loadDoctors();</script></body></html>
